name: Verify Android App

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Verify test patterns
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 tools/verify_patterns.py

      - name: Run unit tests, lint, and release compilation
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease

      - name: Enforce APK size budget
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          SIZE=$(stat -c %s "$APK")
          echo "Release APK: $SIZE bytes (limit: less than 2,000,000 bytes)"
          test "$SIZE" -lt 2000000

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-release.*
          if-no-files-found: ignore
          retention-days: 14

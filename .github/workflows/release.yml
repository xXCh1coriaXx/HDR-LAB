name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag matching versionName (e.g. v0.2.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Resolve release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_TAG: ${{ inputs.tag }}
          PUSH_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            TAG="$REQUESTED_TAG"
          else
            TAG="$PUSH_TAG"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Supply an existing version tag such as v0.2.0."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout existing release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Validate tag and app version
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          chmod +x gradlew
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG^{commit}")"
          VERSION=$(./gradlew --no-daemon -q :app:printVersion)
          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "::error::Release tag $TAG does not match app version v$VERSION."
            exit 1
          fi

      - name: Verify test patterns
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 tools/verify_patterns.py

      - name: Run unit tests, lint, and release compilation
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease

      - name: Package release assets
        id: package
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          APK_SRC=app/build/outputs/apk/release/app-release.apk
          SIZE=$(stat -c %s "$APK_SRC")
          echo "Release APK: $SIZE bytes"
          test "$SIZE" -gt 0
          APK_DEST="HDR-Lab-Light-${TAG}.apk"
          cp "$APK_SRC" "$APK_DEST"
          SOURCE_ZIP="HDR-Lab-Light-${TAG}-source.zip"
          git archive --format=zip --output="$SOURCE_ZIP" HEAD
          CHECKSUMS="HDR-Lab-Light-${TAG}-checksums.txt"
          sha256sum "$APK_DEST" "$SOURCE_ZIP" > "$CHECKSUMS"
          echo "apk=$APK_DEST" >> "$GITHUB_OUTPUT"
          echo "source=$SOURCE_ZIP" >> "$GITHUB_OUTPUT"
          echo "checksums=$CHECKSUMS" >> "$GITHUB_OUTPUT"

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-verification-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-release.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          APK: ${{ steps.package.outputs.apk }}
          SOURCE: ${{ steps.package.outputs.source }}
          CHECKSUMS: ${{ steps.package.outputs.checksums }}
        run: |
          PRERELEASE_FLAGS=()
          if [[ "$TAG" == *"-"* ]]; then
            PRERELEASE_FLAGS+=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$SOURCE" "$CHECKSUMS" --clobber
            if [[ ${#PRERELEASE_FLAGS[@]} -gt 0 ]]; then
              gh release edit "$TAG" "${PRERELEASE_FLAGS[@]}"
            fi
          else
            gh release create "$TAG" "$APK" "$SOURCE" "$CHECKSUMS" \
              --verify-tag \
              --title "HDR Lab Light $TAG" \
              --notes-file RELEASE_NOTES.md \
              "${PRERELEASE_FLAGS[@]}"
          fi
